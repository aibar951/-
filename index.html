<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamGrade - Рейтинг Сна</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #0A0F1E; margin: 0; font-family: system-ui, sans-serif; }
        .glow { shadow-[0_0_20px_rgba(79,70,229,0.4)] }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);

            if (!isLoggedIn) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-[#0A0F1E] p-4 text-center">
                        <div className="w-20 h-20 bg-indigo-600 rounded-3xl mb-6 flex items-center justify-center shadow-[0_0_30px_rgba(79,70,229,0.5)]">
                            <span className="text-3xl">🌙</span>
                        </div>
                        <h1 className="text-4xl font-bold text-white mb-2">DreamGrade</h1>
                        <p className="text-slate-400 mb-8 max-w-sm">Система умного контроля сна и игрового рейтинга для вашего здоровья.</p>
                        <button 
                            onClick={() => setIsLoggedIn(true)}
                            className="w-full max-w-xs py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-2xl transition-all shadow-lg active:scale-95"
                        >
                            Войти в Систему Снов
                        </button>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#0A0F1E] text-white p-6 pb-24">
                    {/* Header */}
                    <div className="flex items-center justify-between mb-8">
                        <div>
                            <p className="text-slate-400 text-sm">Доброе утро,</p>
                            <h2 className="text-xl font-bold">Алекс 👋</h2>
                        </div>
                        <div className="bg-[#161E35] px-4 py-2 rounded-xl border border-gray-800">
                            <span className="text-indigo-400 font-bold">LVL 5</span>
                        </div>
                    </div>

                    {/* Main Score Widget */}
                    <div className="bg-[#161E35] rounded-3xl p-8 border border-gray-800 mb-6 text-center shadow-xl">
                        <p className="text-slate-400 mb-2 uppercase tracking-widest text-xs font-bold">Рейтинг сна</p>
                        <div className="text-7xl font-black text-white mb-2">88<span className="text-2xl text-indigo-500">/100</span></div>
                        <div className="inline-block px-4 py-1 bg-emerald-500/10 text-emerald-500 rounded-full text-sm font-bold border border-emerald-500/20">
                            ОТЛИЧНО
                        </div>
                    </div>

                    {/* Stats Grid */}
                    <div className="grid grid-cols-2 gap-4 mb-8">
                        <div className="bg-[#161E35] p-5 rounded-2xl border border-gray-800">
                            <p className="text-slate-400 text-xs mb-1">Сон</p>
                            <p className="text-xl font-bold">7ч 42м</p>
                        </div>
                        <div className="bg-[#161E35] p-5 rounded-2xl border border-gray-800">
                            <p className="text-slate-400 text-xs mb-1">Глубокий</p>
                            <p className="text-xl font-bold text-indigo-400">22%</p>
                        </div>
                    </div>

                    {/* Blue Light Warning */}
                    <div className="bg-amber-500/5 border border-amber-500/20 p-4 rounded-2xl mb-8 flex items-start gap-3">
                        <span className="text-xl">⚠️</span>
                        <p className="text-sm text-amber-200/80">
                            <span className="font-bold text-amber-400">Внимание:</span> Обнаружен синий свет после 22:00. Рейтинг XP снижен.
                        </p>
                    </div>

                    {/* Bottom Navigation */}
                    <div className="fixed bottom-6 left-6 right-6 bg-[#161E35]/80 backdrop-blur-xl border border-white/5 rounded-3xl p-2 flex justify-around shadow-2xl">
                        <button className="p-4 bg-indigo-600 rounded-2xl text-white">📊</button>
                        <button className="p-4 text-slate-400">⭐</button>
                        <button className="p-4 text-slate-400">⏰</button>
                        <button className="p-4 text-slate-400">⚙️</button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
